name: Build & Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - amidu-inventory-app-improved
      - cloudora-trial-version
  workflow_dispatch:

permissions:
  contents: write

# Prevents two deploys from pushing to gh-pages at the same time
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set deploy target based on branch
        run: |
          if [ "${{ github.ref_name }}" = "cloudora-trial-version" ]; then
            echo "BASE_HREF=/stockSense/cloudora-trial-version/" >> $GITHUB_ENV
            echo "DEST_DIR=cloudora-trial-version" >> $GITHUB_ENV
          else
            echo "BASE_HREF=/stockSense/" >> $GITHUB_ENV
            echo "DEST_DIR=" >> $GITHUB_ENV
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "${{ env.BASE_HREF }}"

      - name: Add .nojekyll
        run: touch build/web/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          destination_dir: ${{ env.DEST_DIR }}
          keep_files: true
          enable_jekyll: false
